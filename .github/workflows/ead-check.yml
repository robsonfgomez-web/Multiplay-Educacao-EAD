name: EAD Platform Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check server.js
      - run: node -e "import('./server.js').then(()=>setTimeout(()=>process.exit(0),500)).catch(e=>{console.error(e);process.exit(1)})"
