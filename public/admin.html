<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Gestão Multiplay EAD</title><link rel="stylesheet" href="/admin.css"></head><body>
<aside><h1>MULTIPLAY</h1><span>Gestão EAD</span><nav><button data-view="dashboard">Dashboard</button><button data-view="courses">Cursos</button><button data-view="students">Alunos</button><button data-view="enrollments">Matrículas</button><button data-view="certificates">Certificados</button></nav><button id="logout" class="logout">Sair</button></aside>
<main><div class="top"><div><b>Gestão Multiplay EAD</b><small id="who"></small></div></div><div id="content"></div></main>
<div id="login" class="login"><form class="loginbox"><h2>Acesso gestor</h2><p>Administre alunos, cursos, matrículas e certificados.</p><input id="email" type="email" placeholder="E-mail administrativo" required><input id="password" type="password" placeholder="Senha" required><button class="primary">Entrar</button><div id="error"></div></form></div>
<script>
const content=document.getElementById("content"),login=document.getElementById("login"),getToken=()=>localStorage.getItem("mp_admin_token")||"";
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:"Bearer "+getToken()};const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Erro");return d}
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function table(headers,rows){return '<div class="table-wrap"><table><tr>'+headers.map(h=>'<th>'+h+'</th>').join("")+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join("")+'</tr>').join("")+'</table></div>'}
async function dashboard(){const s=await api("/api/admin/stats");content.innerHTML='<h2>Dashboard</h2><div class="stats">'+[['courses','Cursos'],['lessons','Aulas'],['students','Alunos ativos'],['enrollments','Matrículas'],['conclusions','Certificados']].map(x=>'<div><b>'+s[x[0]]+'</b><span>'+x[1]+'</span></div>').join("")+'</div><section><h3>Operação EAD</h3><p>Catálogo, alunos, matrículas, progresso e certificados conectados ao PostgreSQL.</p><p class="muted">A cobrança online permanece desligada até a configuração das credenciais de pagamento.</p></section>'}
async function courses(){const rows=await api("/api/admin/courses");content.innerHTML='<h2>Cursos</h2><p class="muted">'+rows.length+' formações disponíveis.</p>'+table(['Curso','Área','Nível','Carga','Módulos','Aulas'],rows.map(x=>[esc(x.title),esc(x.category),esc(x.level),x.hours+"h",x.modules,x.lessons]))}
async function students(){const rows=await api("/api/admin/students");content.innerHTML='<h2>Alunos ativos</h2>'+table(['Nome','E-mail','Status','Cadastro'],rows.map(x=>[esc(x.name),esc(x.email),x.active?'Ativo':'Inativo',new Date(x.created_at).toLocaleDateString("pt-BR")]))}
async function enrollments(){const rows=await api("/api/admin/enrollments");content.innerHTML='<h2>Matrículas</h2>'+table(['Aluno','Curso','Status','Data'],rows.map(x=>[esc(x.name),esc(x.course),esc(x.status),new Date(x.enrolled_at).toLocaleDateString("pt-BR")]))}
async function certificates(){const rows=await api("/api/admin/certificates");content.innerHTML='<h2>Certificados emitidos</h2>'+table(['Aluno','Curso','Código','Data'],rows.map(x=>[esc(x.name),esc(x.course),esc(x.code),new Date(x.issued_at).toLocaleDateString("pt-BR")]))}
async function start(){if(!getToken()){login.classList.remove("hidden");return}try{const me=await api("/api/me");if(me.role!=="admin")throw Error("Usuário sem permissão administrativa");document.getElementById("who").textContent=me.name+" · "+me.email;await dashboard()}catch(e){localStorage.removeItem("mp_admin_token");login.classList.remove("hidden");document.getElementById("error").textContent=e.message}}
document.querySelector(".loginbox").onsubmit=async e=>{e.preventDefault();try{const d=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})}).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error);return x});localStorage.setItem("mp_admin_token",d.token);login.classList.add("hidden");start()}catch(e){document.getElementById("error").textContent=e.message}};
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=async()=>{try{if(b.dataset.view==="dashboard")await dashboard();else if(b.dataset.view==="courses")await courses();else if(b.dataset.view==="students")await students();else if(b.dataset.view==="enrollments")await enrollments();else await certificates()}catch(e){content.innerHTML='<div class="error">'+esc(e.message)+'</div>'}});
document.getElementById("logout").onclick=()=>{localStorage.removeItem("mp_admin_token");location.reload()};start();
</script></body></html>
