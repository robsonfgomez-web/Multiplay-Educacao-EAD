<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Gestão Multiplay EAD</title><link rel="stylesheet" href="/admin.css"></head><body><aside><h1>MULTIPLAY</h1><span>Gestão EAD</span><nav><button data-view="dashboard">Dashboard</button><button data-view="courses">Cursos</button><button data-view="students">Alunos</button><button data-view="enrollments">Matrículas</button><button data-view="certificates">Certificados</button></nav><button id="logout" class="logout">Sair</button></aside><main><div class="top"><div><b>Gestão Multiplay EAD</b><small id="who"></small></div></div><div id="content"></div></main><div id="login" class="login"><form class="loginbox"><h2>Acesso gestor</h2><p>Entre para administrar a plataforma.</p><input id="email" type="email" placeholder="E-mail administrativo" required><input id="password" type="password" placeholder="Senha" required><button class="primary">Entrar</button><div id="error"></div></form></div><script>
const content=document.getElementById("content"),login=document.getElementById("login"),token=()=>localStorage.getItem("mp_admin_token")||"";
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:"Bearer "+token()};const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Erro");return d}
function showLogin(){login.classList.remove("hidden")}
async function start(){if(!token())return showLogin();try{const me=await api("/api/me");document.getElementById("who").textContent=me.name+" · "+me.email;dashboard()}catch(e){localStorage.removeItem("mp_admin_token");showLogin()}}
document.querySelector(".loginbox").onsubmit=async e=>{e.preventDefault();try{const d=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})}).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error);return x});localStorage.setItem("mp_admin_token",d.token);login.classList.add("hidden");start()}catch(e){error.textContent=e.message}};
function dashboard(){api("/api/admin/stats").then(s=>content.innerHTML='<h2>Dashboard</h2><div class="stats"><div><b>'+s.courses+'</b><span>Cursos</span></div><div><b>'+s.lessons+'</b><span>Aulas</span></div><div><b>'+s.students+'</b><span>Alunos ativos</span></div><div><b>'+s.enrollments+'</b><span>Matrículas</span></div><div><b>'+s.conclusions+'</b><span>Certificados</span></div></div><section><h3>Plataforma</h3><p>Gestão conectada ao backend EAD. Cadastro de alunos, matrículas, progresso e certificados estão preparados para operação com PostgreSQL.</p></section>')}
function students(){api("/api/admin/students").then(rows=>content.innerHTML='<h2>Alunos</h2><section><table><tr><th>Nome</th><th>E-mail</th><th>Status</th><th>Cadastro</th></tr>'+rows.map(x=>'<tr><td>'+x.name+'</td><td>'+x.email+'</td><td>'+(x.active?'Ativo':'Inativo')+'</td><td>'+new Date(x.created_at).toLocaleDateString("pt-BR")+'</td></tr>').join("")+'</table></section>')}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>b.dataset.view==="students"?students():dashboard());
document.getElementById("logout").onclick=()=>{localStorage.removeItem("mp_admin_token");location.reload()};
start();
</script></body></html>
